name: Update macro snapshot

on:
  schedule:
    # 每月 8 日 UTC 06:00：美国非农在每月第一个周五公布，8 日之后一定已出
    - cron: '0 6 8 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch FRED / Yahoo / Eastmoney data
        run: |
          node scripts/macro-snapshot.mjs
          node scripts/index-snapshot.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- public/data/macro-us.json public/data/macro-cn.json public/data/macro-hk.json public/data/index-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/macro-us.json public/data/macro-cn.json public/data/macro-hk.json public/data/index-history.json
          git commit -m "data(macro): 更新宏观温度数据 $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Action 用 GITHUB_TOKEN 推送不会触发其他工作流，这里手动触发 Pages 部署（Vercel 由其 GitHub 应用照常部署）
      - name: Deploy GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
