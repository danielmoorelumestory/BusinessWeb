name: Cloud keepalive

on:
  schedule:
    # UTC; Malaysia time 08:23, 16:23, 00:23.
    - cron: '23 0,8,16 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cloud-keepalive
  cancel-in-progress: false

jobs:
  read-cloud-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SITE_URL: https://business-web-pi-eight.vercel.app
      GRID_SYNC_TOKEN: ${{ secrets.GRID_SYNC_TOKEN }}
    steps:
      - name: Check site and read Supabase snapshot through Vercel
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GRID_SYNC_TOKEN" ]]; then
            echo '::error::Set the repository Actions secret GRID_SYNC_TOKEN to the production sync token.'
            exit 1
          fi
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 20 --output /dev/null "$SITE_URL/"
          # Discard the snapshot: never put trading records or credentials in logs.
          # No redirects: do not forward credentials to another origin.
          status=$(curl --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 20 --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GRID_SYNC_TOKEN" \
            "$SITE_URL/api/grid-sync")
          if [[ "$status" != '200' ]]; then
            echo "::error::Cloud snapshot read failed (HTTP $status). Check production configuration and Supabase project status."
            exit 1
          fi
          echo 'Site available; Supabase snapshot read succeeded.'
